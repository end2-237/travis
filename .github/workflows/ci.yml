name: CI

# Build, lint et typecheck exécutés sur GitHub — jamais sur le VPS.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Smoke test — le serveur démarre et répond
        run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/ 2>/dev/null || true
          node .next/standalone/server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000 > /dev/null; then
              echo "✓ L'application répond sur /"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "✗ Le serveur n'a pas démarré"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:3000/evaluation > /dev/null && echo "✓ /evaluation répond"
          kill $SERVER_PID 2>/dev/null || true
